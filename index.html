<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Kejohanan Badminton</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- CryptoJS (SHA-256) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans pb-20 md:pb-0">

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-5 right-5 z-50 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-2xl transition-all duration-300 opacity-0 pointer-events-none transform -translate-y-2 flex items-center gap-2">
        <i data-lucide="info" class="w-5 h-5 text-blue-400"></i>
        <span id="toastMsg" class="text-sm font-medium"></span>
    </div>

    <!-- Header / Navbar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="bg-blue-600 text-white p-2 rounded-lg">
                    <i data-lucide="trophy" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-none">Kejohanan Badminton</h1>
                    <span class="text-xs text-slate-500">Sistem Pengurusan & Live Score</span>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <button id="adminAuthBtn" onclick="handleAdminAuthBtn()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold border transition">
                    <!-- Dynamic Auth Button -->
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto w-full flex-1 p-4">
        
        <!-- Navigation Tabs -->
        <div class="flex bg-slate-200 p-1 rounded-xl mb-6 max-w-md mx-auto">
            <button onclick="switchTab('bracket')" id="tabBtn-bracket" class="flex-1 py-2 text-xs font-bold rounded-lg transition flex justify-center items-center gap-1.5 bg-white text-blue-600 shadow-sm">
                <i data-lucide="git-merge" class="w-4 h-4"></i> Carta Pertandingan
            </button>
            <button onclick="switchTab('participants')" id="tabBtn-participants" class="flex-1 py-2 text-xs font-bold rounded-lg transition flex justify-center items-center gap-1.5 text-slate-600 hover:text-slate-900">
                <i data-lucide="users" class="w-4 h-4"></i> Peserta
            </button>
            <button onclick="switchTab('scoreboard')" id="tabBtn-scoreboard" class="flex-1 py-2 text-xs font-bold rounded-lg transition flex justify-center items-center gap-1.5 text-slate-600 hover:text-slate-900">
                <i data-lucide="activity" class="w-4 h-4"></i> Scoreboard
            </button>
        </div>

        <!-- TAB 1: BRACKET (Carta Pertandingan) -->
        <section id="tab-bracket" class="space-y-4">
            <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <div>
                    <h2 class="font-bold text-slate-800">Jadual & Keputusan</h2>
                    <p class="text-xs text-slate-500">Susunan perlawanan sistem kalah mati</p>
                </div>
                <div id="bracketAdminControls" class="hidden">
                    <button onclick="generateSchedule()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1 transition">
                        <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Jana Jadual
                    </button>
                </div>
            </div>

            <div id="bracketContainer" class="flex gap-6 overflow-x-auto pb-6 pt-2">
                <!-- Bracket Matches Rendered Here -->
            </div>
        </section>

        <!-- TAB 2: PARTICIPANTS (Peserta) -->
        <section id="tab-participants" class="hidden space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex justify-between items-center">
                <div>
                    <h2 class="font-bold text-slate-800">Senarai Peserta</h2>
                    <p class="text-xs text-slate-500">Jumlah: <span id="participantCount">0</span> Pemain / Pasangan</p>
                </div>
                <div id="participantAdminControls" class="hidden">
                    <button onclick="openAddParticipantModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1 transition">
                        <i data-lucide="user-plus" class="w-3.5 h-3.5"></i> Tambah Peserta
                    </button>
                </div>
            </div>

            <div id="participantsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                <!-- Participant Cards Rendered Here -->
            </div>
        </section>

        <!-- TAB 3: SCOREBOARD (Papan Mata Live) -->
        <section id="tab-scoreboard" class="hidden space-y-4">
            <div id="activeMatchSelectContainer" class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <label class="block text-xs font-bold text-slate-500 mb-1">Pilih Perlawanan Aktif:</label>
                <select id="matchSelect" onchange="selectActiveMatch(this.value)" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <!-- Match Options -->
                </select>
            </div>

            <div id="scoreboardDisplay" class="bg-slate-900 text-white rounded-2xl p-6 shadow-xl relative overflow-hidden">
                <!-- Scoreboard Details Rendered Here -->
            </div>
        </section>

    </main>

    <!-- MODAL: Log Masuk Admin -->
    <div id="adminModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50 p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-slate-800">Log Masuk Admin</h3>
                <button onclick="closeAdminModal()" class="text-slate-400 hover:text-slate-600">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <p class="text-xs text-slate-500 mb-4">Masukkan PIN pentadbir untuk menguruskan kejohanan.</p>

            <input 
                type="password" 
                id="adminPinInput" 
                placeholder="Masukkan PIN" 
                maxlength="8" 
                onkeydown="if(event.key === 'Enter') verifyAdminPin()"
                class="w-full border border-slate-300 rounded-xl p-3 text-center text-2xl tracking-widest focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4 font-mono"
            />

            <div class="flex gap-2">
                <button onclick="closeAdminModal()" class="flex-1 bg-slate-100 text-slate-600 py-2.5 rounded-xl font-semibold hover:bg-slate-200 transition text-sm">
                    Batal
                </button>
                <button onclick="verifyAdminPin()" class="flex-1 bg-blue-600 text-white py-2.5 rounded-xl font-semibold hover:bg-blue-700 transition text-sm">
                    Hantar
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL: Tambah Peserta -->
    <div id="addParticipantModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50 p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-slate-800">Tambah Peserta Baharu</h3>
                <button onclick="closeAddParticipantModal()" class="text-slate-400 hover:text-slate-600">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form id="participantForm" onsubmit="saveParticipant(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Nama Pemain 1 *</label>
                    <input type="text" id="pName1" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Nama Pemain 2 (Jika Bergu)</label>
                    <input type="text" id="pName2" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Pasukan / Kelab</label>
                    <input type="text" id="pTeam" placeholder="Contoh: Kategori A" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="closeAddParticipantModal()" class="flex-1 bg-slate-100 text-slate-600 py-2.5 rounded-xl font-semibold text-sm">Batal</button>
                    <button type="submit" class="flex-1 bg-blue-600 text-white py-2.5 rounded-xl font-semibold text-sm hover:bg-blue-700">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JAVASCRIPT APPLICATION LOGIC -->
    <script>
        // SHA-256 Hash untuk PIN "2468" (Format 全小写)
        const ADMIN_PIN_HASH = "8d969eef6ecad3c29a3a629280e686cf0c3f5d5a86aff3ca12020c923adc6c92";

        // Global State
        let appState = {
            isAdmin: false,
            currentTab: 'bracket',
            activeMatchId: null,
            players: [
                { id: 'p1', name1: 'Ahmad', name2: '', team: 'Kluang Club' },
                { id: 'p2', name1: 'Chong', name2: 'Tan', team: 'JBR Doubles' },
                { id: 'p3', name1: 'Maniam', name2: '', team: 'Indah SG' },
                { id: 'p4', name1: 'Siti', name2: 'Nur', team: 'SMK Kampong' }
            ],
            matches: []
        };

        // Match Rule Configurations
        const MATCH_RULES = {
            targetPoints: 21,
            capPoints: 30,
            setsToWin: 2,
            mode: 'BEST_OF_3' // BEST_OF_3 or SINGLE_SET
        };

        // --- INIT & UTILS ---
        window.addEventListener('DOMContentLoaded', () => {
            generateSchedule(); // Auto-build initial schedule
            updateUI();
        });

        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-2');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none', '-translate-y-2');
            }, 3000);
        }

        function switchTab(tabName) {
            appState.currentTab = tabName;
            ['bracket', 'participants', 'scoreboard'].forEach(t => {
                const tabEl = document.getElementById(`tab-${t}`);
                const btnEl = document.getElementById(`tabBtn-${t}`);
                if (t === tabName) {
                    tabEl.classList.remove('hidden');
                    btnEl.className = "flex-1 py-2 text-xs font-bold rounded-lg transition flex justify-center items-center gap-1.5 bg-white text-blue-600 shadow-sm";
                } else {
                    tabEl.classList.add('hidden');
                    btnEl.className = "flex-1 py-2 text-xs font-bold rounded-lg transition flex justify-center items-center gap-1.5 text-slate-600 hover:text-slate-900";
                }
            });
            updateUI();
        }

        // --- ADMIN AUTH (FIXED & OPTIMIZED) ---
        function handleAdminAuthBtn() {
            if (appState.isAdmin) {
                appState.isAdmin = false;
                showToast("Telah keluar dari Mod Admin.");
                updateUI();
            } else {
                openAdminModal();
            }
        }

        function openAdminModal() {
            const modal = document.getElementById('adminModal');
            const input = document.getElementById('adminPinInput');
            modal.classList.remove('hidden');
            input.value = '';
            setTimeout(() => input.focus(), 100);
        }

        function closeAdminModal() {
            document.getElementById('adminModal').classList.add('hidden');
        }

        function verifyAdminPin() {
            const pinInput = document.getElementById('adminPinInput');
            if (!pinInput) return;

            // 转化为纯字符串并去除空格
            const rawValue = String(pinInput.value).trim();
            if (!rawValue) {
                showToast("Sila masukkan PIN!");
                return;
            }

            // 计算 SHA-256 并统一为小写
            const inputHash = CryptoJS.SHA256(rawValue).toString().toLowerCase();

            if (inputHash === ADMIN_PIN_HASH) {
                appState.isAdmin = true;
                pinInput.value = '';
                closeAdminModal();
                updateUI();
                showToast("Mod Admin Diaktifkan!");
            } else {
                showToast("PIN Salah! Sila cuba lagi.");
                pinInput.value = '';
                pinInput.focus();
            }
        }

        // --- UI RENDER ENGINE ---
        function updateUI() {
            // Admin Auth Button Status
            const authBtn = document.getElementById('adminAuthBtn');
            if (appState.isAdmin) {
                authBtn.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200";
                authBtn.innerHTML = `<i data-lucide="unlock" class="w-3.5 h-3.5"></i> Admin (Keluar)`;
            } else {
                authBtn.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 text-slate-700 border border-slate-200 hover:bg-slate-200";
                authBtn.innerHTML = `<i data-lucide="lock" class="w-3.5 h-3.5"></i> Mod Admin`;
            }

            // Admin Controls Visibility
            document.getElementById('bracketAdminControls').style.display = appState.isAdmin ? 'block' : 'none';
            document.getElementById('participantAdminControls').style.display = appState.isAdmin ? 'block' : 'none';

            // Tab-specific rendering
            if (appState.currentTab === 'bracket') renderBracket();
            if (appState.currentTab === 'participants') renderParticipants();
            if (appState.currentTab === 'scoreboard') renderScoreboard();

            lucide.createIcons();
        }

        // --- PARTICIPANTS MANAGEMENT ---
        function renderParticipants() {
            const container = document.getElementById('participantsList');
            document.getElementById('participantCount').innerText = appState.players.length;

            if (appState.players.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-8 text-slate-400 text-sm">Tiada peserta didaftarkan.</div>`;
                return;
            }

            container.innerHTML = appState.players.map((p, index) => `
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex justify-between items-center">
                    <div>
                        <div class="text-xs font-bold text-blue-600 mb-0.5">#${index + 1} ${p.team ? `• ${p.team}` : ''}</div>
                        <div class="font-bold text-slate-800">${p.name1}${p.name2 ? ` & ${p.name2}` : ''}</div>
                    </div>
                    ${appState.isAdmin ? `
                        <button onclick="deleteParticipant('${p.id}')" class="text-rose-500 hover:bg-rose-50 p-2 rounded-lg transition">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    ` : ''}
                </div>
            `).join('');
        }

        function openAddParticipantModal() {
            document.getElementById('participantForm').reset();
            document.getElementById('addParticipantModal').classList.remove('hidden');
        }

        function closeAddParticipantModal() {
            document.getElementById('addParticipantModal').classList.add('hidden');
        }

        function saveParticipant(e) {
            e.preventDefault();
            const p1 = document.getElementById('pName1').value.trim();
            const p2 = document.getElementById('pName2').value.trim();
            const team = document.getElementById('pTeam').value.trim();

            if (!p1) return;

            appState.players.push({
                id: 'p_' + Date.now(),
                name1: p1,
                name2: p2,
                team: team
            });

            closeAddParticipantModal();
            generateSchedule();
            updateUI();
            showToast("Peserta berjaya ditambah!");
        }

        function deleteParticipant(id) {
            if (!confirm("Adakah anda pasti mahu memadam peserta ini?")) return;
            appState.players = appState.players.filter(p => p.id !== id);
            generateSchedule();
            updateUI();
            showToast("Peserta dipadam.");
        }

        // --- BRACKET & MATCH GENERATION (BUG FIXES INCLUDED) ---
        function generateSchedule() {
            const players = [...appState.players];
            if (players.length < 2) {
                appState.matches = [];
                return;
            }

            // Shuffle / Randomize
            for (let i = players.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [players[i], players[j]] = [players[j], players[i]];
            }

            // Calculate tournament slots (next power of 2)
            const count = players.length;
            const targetSize = Math.pow(2, Math.ceil(Math.log2(count)));
            const byesCount = targetSize - count;

            let round1Slots = [];
            for (let i = 0; i < count; i++) round1Slots.push(players[i]);
            for (let i = 0; i < byesCount; i++) round1Slots.push({ id: 'BYE', name1: 'BYE (Langkah Kanan)', isBye: true });

            let matches = [];
            let matchIdCounter = 1;
            const numRounds = Math.log2(targetSize);

            // Generate Round 1
            for (let i = 0; i < round1Slots.length; i += 2) {
                const pA = round1Slots[i];
                const pB = round1Slots[i + 1];

                const isByeMatch = pA.isBye || pB.isBye;
                const winner = pA.isBye ? pB : (pB.isBye ? pA : null);

                matches.push({
                    id: `m_1_${matchIdCounter++}`,
                    round: 1,
                    playerA: pA.isBye ? null : pA,
                    playerB: pB.isBye ? null : pB,
                    scoreA: 0,
                    scoreB: 0,
                    setsA: 0,
                    setsB: 0,
                    setHistory: [],
                    status: isByeMatch ? 'Tamat' : 'Belum Mula',
                    winner: winner,
                    nextMatchId: null,
                    nextSlot: null
                });
            }

            // Generate Subsequent Rounds
            let currentRoundMatches = matches.filter(m => m.round === 1);
            for (let r = 2; r <= numRounds; r++) {
                let nextRoundMatches = [];
                for (let i = 0; i < currentRoundMatches.length; i += 2) {
                    const nextMId = `m_${r}_${matchIdCounter++}`;
                    const nextM = {
                        id: nextMId,
                        round: r,
                        playerA: null,
                        playerB: null,
                        scoreA: 0,
                        scoreB: 0,
                        setsA: 0,
                        setsB: 0,
                        setHistory: [],
                        status: 'Belum Mula',
                        winner: null,
                        nextMatchId: null,
                        nextSlot: null
                    };

                    currentRoundMatches[i].nextMatchId = nextMId;
                    currentRoundMatches[i].nextSlot = 'A';

                    if (currentRoundMatches[i + 1]) {
                        currentRoundMatches[i + 1].nextMatchId = nextMId;
                        currentRoundMatches[i + 1].nextSlot = 'B';
                    }

                    nextRoundMatches.push(nextM);
                    matches.push(nextM);
                }
                currentRoundMatches = nextRoundMatches;
            }

            // AUTO-ADVANCE BYE PLAYERS TO ROUND 2
            matches.forEach(m => {
                if (m.round === 1 && m.winner && m.nextMatchId) {
                    const nextM = matches.find(nm => nm.id === m.nextMatchId);
                    if (nextM) {
                        if (m.nextSlot === 'A') nextM.playerA = m.winner;
                        if (m.nextSlot === 'B') nextM.playerB = m.winner;
                    }
                }
            });

            appState.matches = matches;
            if (!appState.activeMatchId && matches.length > 0) {
                appState.activeMatchId = matches[0].id;
            }
        }

        function renderBracket() {
            const container = document.getElementById('bracketContainer');
            if (appState.matches.length === 0) {
                container.innerHTML = `<div class="w-full text-center py-12 text-slate-400">Sila tambah sekurang-kurangnya 2 peserta untuk menjana carta.</div>`;
                return;
            }

            const rounds = {};
            appState.matches.forEach(m => {
                if (!rounds[m.round]) rounds[m.round] = [];
                rounds[m.round].push(m);
            });

            container.innerHTML = Object.keys(rounds).map(r => `
                <div class="flex-shrink-0 w-72 space-y-4">
                    <div class="text-xs font-bold text-slate-400 uppercase tracking-wider text-center">
                        ${r == Object.keys(rounds).length ? 'Peringkat Akhir' : (r == Object.keys(rounds).length - 1 ? 'Separuh Akhir' : `Pusingan ${r}`)}
                    </div>
                    <div class="space-y-3">
                        ${rounds[r].map(m => renderBracketCard(m)).join('')}
                    </div>
                </div>
            `).join('');
        }

        function renderBracketCard(m) {
            const nameA = m.playerA ? (m.playerA.name2 ? `${m.playerA.name1}/${m.playerA.name2}` : m.playerA.name1) : 'Menunggu...';
            const nameB = m.playerB ? (m.playerB.name2 ? `${m.playerB.name1}/${m.playerB.name2}` : m.playerB.name1) : 'Menunggu...';
            const isWinnerA = m.winner && m.playerA && m.winner.id === m.playerA.id;
            const isWinnerB = m.winner && m.playerB && m.winner.id === m.playerB.id;

            return `
                <div onclick="selectActiveMatch('${m.id}')" class="bg-white rounded-xl p-3 shadow-sm border ${appState.activeMatchId === m.id ? 'border-blue-500 ring-2 ring-blue-100' : 'border-slate-200'} cursor-pointer hover:border-slate-300 transition">
                    <div class="flex justify-between items-center text-[10px] font-bold text-slate-400 mb-2">
                        <span>PERLAWANAN #${m.id.split('_')[2]}</span>
                        <span class="px-1.5 py-0.5 rounded ${m.status === 'Sedang Berlangsung' ? 'bg-amber-100 text-amber-700' : (m.status === 'Tamat' ? 'bg-slate-100 text-slate-600' : 'bg-slate-50 text-slate-400')}">${m.status}</span>
                    </div>

                    <!-- Player A -->
                    <div class="flex justify-between items-center p-1.5 rounded-lg ${isWinnerA ? 'bg-emerald-50 text-emerald-900 font-bold' : 'text-slate-700'}">
                        <span class="text-xs truncate max-w-[160px]">${nameA}</span>
                        <span class="text-xs font-mono font-bold">${m.setsA}</span>
                    </div>

                    <div class="border-b border-slate-100 my-1"></div>

                    <!-- Player B -->
                    <div class="flex justify-between items-center p-1.5 rounded-lg ${isWinnerB ? 'bg-emerald-50 text-emerald-900 font-bold' : 'text-slate-700'}">
                        <span class="text-xs truncate max-w-[160px]">${nameB}</span>
                        <span class="text-xs font-mono font-bold">${m.setsB}</span>
                    </div>
                </div>
            `;
        }

        // --- SCOREBOARD ENGINE ---
        function selectActiveMatch(matchId) {
            appState.activeMatchId = matchId;
            switchTab('scoreboard');
        }

        function renderScoreboard() {
            const selectEl = document.getElementById('matchSelect');
            selectEl.innerHTML = appState.matches.map(m => {
                const pA = m.playerA ? m.playerA.name1 : 'TBA';
                const pB = m.playerB ? m.playerB.name1 : 'TBA';
                return `<option value="${m.id}" ${m.id === appState.activeMatchId ? 'selected' : ''}>Perlawanan #${m.id.split('_')[2]} (${pA} vs ${pB}) - [${m.status}]</option>`;
            }).join('');

            const m = appState.matches.find(x => x.id === appState.activeMatchId);
            const container = document.getElementById('scoreboardDisplay');

            if (!m) {
                container.innerHTML = `<div class="text-center py-12 text-slate-400">Tiada perlawanan dipilih.</div>`;
                return;
            }

            const nameA = m.playerA ? (m.playerA.name2 ? `${m.playerA.name1} / ${m.playerA.name2}` : m.playerA.name1) : 'Menunggu...';
            const nameB = m.playerB ? (m.playerB.name2 ? `${m.playerB.name1} / ${m.playerB.name2}` : m.playerB.name1) : 'Menunggu...';

            container.innerHTML = `
                <div class="flex justify-between items-center mb-6">
                    <span class="bg-blue-500/20 text-blue-300 text-xs px-3 py-1 rounded-full font-semibold border border-blue-500/30">
                        ${m.status}
                    </span>
                    <span class="text-xs text-slate-400">Set Ke-${m.setsA + m.setsB + 1}</span>
                </div>

                <div class="grid grid-cols-2 gap-4 text-center my-4">
                    <!-- Player A Score -->
                    <div class="bg-slate-800/80 p-4 rounded-xl border border-slate-700">
                        <h4 class="text-sm font-bold text-slate-300 truncate mb-1">${nameA}</h4>
                        <div class="text-5xl font-extrabold font-mono my-2 text-blue-400">${m.scoreA}</div>
                        <div class="text-xs text-slate-400">Set Menang: ${m.setsA}</div>
                        ${appState.isAdmin && m.status !== 'Tamat' ? `
                            <div class="flex gap-1 mt-4">
                                <button onclick="addPoint('${m.id}', 'A', 1)" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white py-2 rounded-lg font-bold text-sm">+1</button>
                                <button onclick="addPoint('${m.id}', 'A', -1)" class="bg-slate-700 hover:bg-slate-600 text-slate-300 px-3 rounded-lg font-bold text-sm">-1</button>
                            </div>
                        ` : ''}
                    </div>

                    <!-- Player B Score -->
                    <div class="bg-slate-800/80 p-4 rounded-xl border border-slate-700">
                        <h4 class="text-sm font-bold text-slate-300 truncate mb-1">${nameB}</h4>
                        <div class="text-5xl font-extrabold font-mono my-2 text-rose-400">${m.scoreB}</div>
                        <div class="text-xs text-slate-400">Set Menang: ${m.setsB}</div>
                        ${appState.isAdmin && m.status !== 'Tamat' ? `
                            <div class="flex gap-1 mt-4">
                                <button onclick="addPoint('${m.id}', 'B', 1)" class="flex-1 bg-rose-600 hover:bg-rose-500 text-white py-2 rounded-lg font-bold text-sm">+1</button>
                                <button onclick="addPoint('${m.id}', 'B', -1)" class="bg-slate-700 hover:bg-slate-600 text-slate-300 px-3 rounded-lg font-bold text-sm">-1</button>
                            </div>
                        ` : ''}
                    </div>
                </div>

                <!-- Set History -->
                ${m.setHistory.length > 0 ? `
                    <div class="mt-4 pt-4 border-t border-slate-800 text-center">
                        <span class="text-xs text-slate-500 block mb-1">Keputusan Set Lepas:</span>
                        <div class="flex justify-center gap-2">
                            ${m.setHistory.map((s, idx) => `<span class="bg-slate-800 px-2 py-1 rounded text-xs font-mono text-slate-300">Set ${idx+1}: ${s.a}-${s.b}</span>`).join('')}
                        </div>
                    </div>
                ` : ''}
            `;
        }

        // --- SCORING & ADVANCEMENT LOGIC ---
        function addPoint(matchId, player, delta) {
            const m = appState.matches.find(x => x.id === matchId);
            if (!m || m.status === 'Tamat') return;

            m.status = 'Sedang Berlangsung';

            if (player === 'A') m.scoreA = Math.max(0, m.scoreA + delta);
            if (player === 'B') m.scoreB = Math.max(0, m.scoreB + delta);

            checkSetWinner(m);
            updateUI();
        }

        function checkSetWinner(m) {
            const rule = MATCH_RULES;
            const a = m.scoreA;
            const b = m.scoreB;

            let setWonBy = null;

            // Simple or Standard BWF 21-point rules
            if ((a >= rule.targetPoints && a - b >= 2) || a === rule.capPoints) setWonBy = 'A';
            else if ((b >= rule.targetPoints && b - a >= 2) || b === rule.capPoints) setWonBy = 'B';

            if (setWonBy) {
                m.setHistory.push({ a: m.scoreA, b: m.scoreB });
                if (setWonBy === 'A') m.setsA++;
                if (setWonBy === 'B') m.setsB++;

                m.scoreA = 0;
                m.scoreB = 0;

                if (m.setsA === rule.setsToWin || m.setsB === rule.setsToWin) {
                    m.status = 'Tamat';
                    m.winner = m.setsA === rule.setsToWin ? m.playerA : m.playerB;
                    
                    // 安全可选链，防止 NULL 崩溃
                    const winnerName = m.winner ? (m.winner.name2 ? `${m.winner.name1}/${m.winner.name2}` : m.winner.name1) : '-';
                    showToast(`Perlawanan Tamat! Pemenang: ${winnerName}`);
                    
                    advanceWinnerInBracket(m);
                } else {
                    const winnerName = setWonBy === 'A' ? m.playerA?.name1 : m.playerB?.name1;
                    showToast(`Set Tamat! Menang Set: ${winnerName}`);
                }
            }
        }

        function advanceWinnerInBracket(m) {
            if (!m.nextMatchId || !m.winner) return;
            const nextM = appState.matches.find(x => x.id === m.nextMatchId);
            if (!nextM) return;

            if (m.nextSlot === 'A') nextM.playerA = m.winner;
            if (m.nextSlot === 'B') nextM.playerB = m.winner;
        }
    </script>
</body>
</html>
